# Requires repo secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_SERIAL.

name: Integration tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  build-webgl:
    name: Build WebGL — ${{ matrix.scene.name }} (Unity 6000.3.6f1)
    runs-on: ubuntu-latest
    strategy:
      # Run both scenes in parallel on separate runners — each gets its own
      # TestProject/ checkout so they don't conflict on the Unity project lock.
      # fail-fast: false so a failure in one scene doesn't cancel the other,
      # making CI logs more useful when only one is broken.
      fail-fast: false
      matrix:
        scene:
          - name: primitives
            buildMethod: ElevenLabs.WebGL.Editor.HostBuild.Build
            outputPath: TestProject/Build/WebGL
            artifactName: webgl-smoke-build
          - name: conversation
            buildMethod: ElevenLabs.WebGL.Editor.HostBuild.BuildConversation
            outputPath: TestProject/Build/WebGLConversationSmoke
            artifactName: webgl-conversation-smoke-build
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Reclaim ~25 GB so the Unity image (~7 GB compressed, ~20 GB
      # extracted) fits on ubuntu-latest's ~14 GB root partition.
      - name: Free disk space for Unity image
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          echo "After:"
          df -h /

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: TestProject/Library
          # Both matrix entries share the same Library cache (asset import +
          # IL2CPP state is scene-independent); whichever job finishes first
          # writes the cache, the second sees the key exists and no-ops the
          # save. Safe under parallel writes.
          key: Library-TestProject-WebGL-${{ hashFiles('TestProject/Packages/packages-lock.json', 'TestProject/ProjectSettings/ProjectSettings.asset') }}
          restore-keys: |
            Library-TestProject-WebGL-
            Library-TestProject-

      # `buildMethod` runs the same entry point as the corresponding
      # TestProject/build-webgl*.sh script (Build → primitives, BuildConversation → conversation).
      - name: Build WebGL
        uses: game-ci/unity-builder@d829bfc901f2347c8fe18898f06712b66916ef42 # v5.0.0
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProject
          unityVersion: 6000.3.6f1
          targetPlatform: WebGL
          customImage: unityci/editor:ubuntu-6000.3.6f1-webgl-3.2.2
          buildMethod: ${{ matrix.scene.buildMethod }}
          allowDirtyBuild: true

      - name: Upload WebGL build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scene.artifactName }}
          path: ${{ matrix.scene.outputPath }}
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: Integration tests (Playwright + Chromium)
    runs-on: ubuntu-latest
    # Depends on the full matrix — GitHub waits for both scenes to finish
    # before running the tests, which need both build artifacts on disk.
    needs: build-webgl
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download primitives WebGL build
        uses: actions/download-artifact@v7
        with:
          name: webgl-smoke-build
          path: TestProject/Build/WebGL

      - name: Download conversation WebGL build
        uses: actions/download-artifact@v7
        with:
          name: webgl-conversation-smoke-build
          path: TestProject/Build/WebGLConversationSmoke

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/krypton
          cache: pnpm
          cache-dependency-path: IntegrationTests~/pnpm-lock.yaml

      - name: Install IntegrationTests~ dependencies
        working-directory: "IntegrationTests~"
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: "IntegrationTests~"
        run: pnpm run setup

      - name: Run browser-mode integration tests
        working-directory: "IntegrationTests~"
        run: pnpm run test:ci

      - name: Publish integration test results
        if: always()
        uses: mikepenz/action-junit-report@db71d41eb79864e25ab0337e395c352e84523afe # v4.3.1
        with:
          report_paths: "IntegrationTests~/test-results.junit.xml"
          check_name: Integration test details
          require_tests: true
          detailed_summary: true
          include_passed: true
