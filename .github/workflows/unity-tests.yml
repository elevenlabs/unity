# Requires repo secrets: UNITY_EMAIL, UNITY_PASSWORD, UNITY_SERIAL.

name: Unity Edit Mode tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"
  pull_request_target:
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"

concurrency:
  group: unity-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  edit-mode:
    name: Edit Mode tests (Unity 6000.3.6f1)
    # Fork PRs get no secrets under pull_request, so they run via pull_request_target behind fork-ci approval.
    if: >-
      github.repository == 'elevenlabs/unity' && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository)
      )
    environment: ${{ github.event_name == 'pull_request_target' && 'fork-ci' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          persist-credentials: false

      # Reclaim ~25 GB so the Unity image (~7 GB compressed, ~20 GB
      # extracted) fits on ubuntu-latest's ~14 GB root partition.
      - name: Free disk space for Unity image
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          echo "After:"
          df -h /

      - name: Cache Unity Library
        if: github.event_name != 'pull_request_target'
        uses: actions/cache@v5
        with:
          path: TestProject/Library
          key: Library-TestProject-EditMode-${{ hashFiles('TestProject/Packages/packages-lock.json', 'TestProject/ProjectSettings/ProjectSettings.asset') }}
          restore-keys: |
            Library-TestProject-EditMode-
            Library-TestProject-

      # Fork runs write caches into main's scope, so they only restore.
      - name: Restore Unity Library
        if: github.event_name == 'pull_request_target'
        uses: actions/cache/restore@v5
        with:
          path: TestProject/Library
          key: Library-TestProject-EditMode-${{ hashFiles('TestProject/Packages/packages-lock.json', 'TestProject/ProjectSettings/ProjectSettings.asset') }}
          restore-keys: |
            Library-TestProject-EditMode-
            Library-TestProject-

      - name: Run Edit Mode tests
        id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProject
          unityVersion: 6000.3.6f1
          customImage: unityci/editor:ubuntu-6000.3.6f1-webgl-3.2.2
          testMode: editmode
          artifactsPath: artifacts
          checkName: Edit Mode tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edit-mode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
