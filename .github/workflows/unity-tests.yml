# Unity Edit Mode lane — runs the TestProject's Edit Mode tests via
# game-ci/unity-test-runner@v4, activated against the Industry trial
# serial (Option A in `Docs~/plans/ci.md`). Tracked as task 5.3.3.
#
# Secrets required (configured 2026-06-18):
#   UNITY_SERIAL   — Industry trial serial from the Unity ID dashboard
#   UNITY_EMAIL    — maintainer's Unity ID email
#   UNITY_PASSWORD — maintainer's Unity ID password (alphanumeric only)
#
# The trial expires 2026-07-19; see `Docs~/plans/ci.md` (Option A
# operational caveats) for the re-activation decision tree.

name: Unity Edit Mode tests

# `paths-ignore` skips the ~6 min Edit Mode run whenever EVERY changed
# file is docs / Claude config. Mirrors the same patterns used in
# `integration.yml`. This works for unity-tests because the
# `Edit Mode tests (Unity 6000.3.6f1)` check is informational only —
# branch protection on `main` was relaxed to require just lint on
# 2026-06-19; see decision 3 in `Docs~/plans/ci.md` for the rationale.
on:
  push:
    branches: [main]
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "Docs~/**"
      - "**.md"
      - ".claude/**"

# Industry trial allows 2 concurrent activations; scope by ref so a
# force-push cancels the previous run for that branch rather than
# fighting for a seat with itself. Cross-branch parallelism stays open
# (up to the 2-seat ceiling). Tighten to `group: unity-tests` (no ref
# suffix) if LICENSE_ALREADY_IN_USE shows up in practice.
concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  edit-mode:
    name: Edit Mode tests (Unity 6000.3.6f1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The Unity editor image (~7 GB compressed, ~20 GB on disk) plus
      # the cached Library/ plus runner overhead overflows the
      # ubuntu-latest runner's ~14 GB root partition; the cold pull
      # fails with `no space left on device` partway through. Drop the
      # pre-installed toolchains we don't use (Android SDK ~9 GB,
      # dotnet ~1.7 GB, GHC ~5 GB, CodeQL ~5 GB, boost/powershell ~2 GB).
      # Inline rather than `jlumbroso/free-disk-space` to avoid another
      # org Actions allowlist round-trip.
      - name: Free disk space for Unity image
        run: |
          echo "Before:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}"
          echo "After:"
          df -h /

      # Library/ rebuild dominates wall time on cold runs. Key on
      # packages-lock.json + ProjectSettings.asset so dependency or
      # project-setting changes invalidate correctly; otherwise the
      # cache is reused across PRs.
      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: TestProject/Library
          key: Library-TestProject-EditMode-${{ hashFiles('TestProject/Packages/packages-lock.json', 'TestProject/ProjectSettings/ProjectSettings.asset') }}
          restore-keys: |
            Library-TestProject-EditMode-
            Library-TestProject-

      - name: Run Edit Mode tests
        id: tests
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9 # v4.3.1
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: TestProject
          unityVersion: 6000.3.6f1
          # Pinned WebGL-flavoured image — shared with the upcoming
          # integration workflow (5.3.4) for Docker layer reuse.
          customImage: unityci/editor:ubuntu-6000.3.6f1-webgl-3.2.2
          testMode: editmode
          artifactsPath: artifacts
          checkName: Edit Mode tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: edit-mode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
